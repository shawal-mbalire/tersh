name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # pnpm installs the dependencies and the pinned bun that runs the frontend.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          standalone: true
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: extractions/setup-just@v2
      - run: just setup
      - run: just typecheck
      - run: just format-check
      - run: just third-party-check
      # Page, core, tersh-show, the Neovim-in-a-PTY test and the Neovim plugin
      # (the Tauri crate needs WebKitGTK; see the desktop job).
      - run: just test

  desktop:
    # The Tauri crate (CLI, updates, window) needs WebKitGTK to build.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # pnpm installs the dependencies and the pinned bun that runs the frontend.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          standalone: true
      - uses: extractions/setup-just@v2
      - run: just setup
      - run: just clippy-desktop
      - run: just desktop-test
