[package]
name = "tersh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A hyper-lightweight, extensible terminal with rich media cards"

[lib]
name = "tersh_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tersh-adapters = { path = "../crates/tersh-adapters" }
tersh-app = { path = "../crates/tersh-app" }
tersh-domain = { path = "../crates/tersh-domain" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.8"
